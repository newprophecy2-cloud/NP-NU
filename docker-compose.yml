services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-npnu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-npnu_staging_password}
      POSTGRES_DB: ${POSTGRES_DB:-npnu}
    volumes:
      - npnu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npnu} -d ${POSTGRES_DB:-npnu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - npnu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: staging
      PORT: 4000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3100}
      API_URL: ${API_URL:-http://localhost:4100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-npnu}:${POSTGRES_PASSWORD:-npnu_staging_password}@postgres:5432/${POSTGRES_DB:-npnu}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-staging-session-secret-change-me-32-chars}
      AUTH_SECRET: ${AUTH_SECRET:-staging-auth-secret-change-me-32-chars-min}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      LOG_LEVEL: info
    ports:
      - "4100:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-npnu}:${POSTGRES_PASSWORD:-npnu_staging_password}@postgres:5432/${POSTGRES_DB:-npnu}
      REDIS_URL: redis://redis:6379
      SCRAPER_USER_AGENT: NP-NU-Bot/1.0 (+https://github.com/newprophecy2-cloud/NP-NU)
      SCRAPER_REQUEST_TIMEOUT_MS: 12000
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "3100:3000"
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  npnu_pg_data:
  npnu_redis_data:
