services:
  - type: web
    name: np-nu-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    branch: main
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: np-nu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: np-nu-redis
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_URL
        value: https://np-nu-web.onrender.com
      - key: API_URL
        value: https://np-nu-api.onrender.com

  - type: web
    name: np-nu-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.web
    dockerContext: .
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOSTPORT
        fromService:
          name: np-nu-api
          type: web
          property: hostport
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1

  - type: worker
    name: np-nu-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.worker
    dockerContext: .
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: np-nu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: np-nu-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: np-nu-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: np-nu-db
    plan: free
    databaseName: npnu
    user: npnu
