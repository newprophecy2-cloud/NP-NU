name: NP-NU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build packages, API, scraper, and Next.js web
        run: npm run build

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Run unit & scraper fixture tests
        run: npm run test
